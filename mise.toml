[tools]
rust = "stable"

[tasks.build]
description = "Build pc2mqtt binary"
run = "cargo build --release"

[tasks.deploy]
description = "Build and deploy pc2mqtt binary to /opt/pc2mqtt"
depends = ["build"]
run = "sudo install -m 755 target/x86_64-unknown-linux-musl/release/pc2mqtt /opt/pc2mqtt/pc2mqtt.new && sudo mv -f /opt/pc2mqtt/pc2mqtt.new /opt/pc2mqtt/pc2mqtt"
