name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - run: cargo test --locked --target x86_64-unknown-linux-gnu
