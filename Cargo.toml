[package]
name = "pc2mqtt"
version = "0.1.0"
edition = "2024"

[dependencies]
http = "1"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls", "websocket"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v4"] }

tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "process", "io-util"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
incremental = false
panic = "abort"
strip = true
