[package]
name = "pc2mqtt"
version = "0.1.0"
edition = "2024"

[dependencies]
url = "2"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls", "websocket"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v4"] }

tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tonic = { version = "0.14", default-features = false, features = ["router"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
incremental = false
panic = "abort"
strip = true
